version: '3.8'

# postgres/redis/backend (NestJS) retired in docs/migration/plan.md Phase 17
# — the app runs against hosted Supabase now, and nothing left needs a
# queue (assign-technician's BullMQ/Redis dependency was superseded by the
# marketplace + RLS model in Phases 5/8/10, not replaced with another
# queue). ai-service is the one thing that's still genuinely local/
# self-hosted (docs/migration/plan.md Phase 13 — its Edge Function proxy
# was never built, so this is still how you'd run it for local testing).
services:
  ai-service:
    build: ./apps/ai-service
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
    ports:
      - "8000:8000"
